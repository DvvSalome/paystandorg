<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grant Application 2027 — Paystand Impact Foundation</title>
<meta name="description" content="Apply for a 2027 Paystand Impact Foundation grant.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/form.css">
<style>
  /* Palette sampled from the paystand.org page in Wix (see docs/brand.md) */
  :root {
    --ps-navy: #011B5B;
    --ps-coral: #E4714D;
    --ps-bg: #ECF1FD;
    --ps-card: #FFFFFF;
    --ps-light: #E3EAF8;
    --ps-border: #C9D1DB;
    --ps-text: #1F2C3E;
    --ps-gray: #5B6675;
    --ps-btn: #2F6FB3;
    --ps-blue: #2F6FB3;
    --ps-link: #1D4ED8;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); color: var(--ps-text); background: var(--ps-bg); line-height: 1.55; }
  a { color: var(--ps-link); }
  .wrap { max-width: 820px; margin: 0 auto; padding-inline: max(20px, env(safe-area-inset-left)); }
  a:focus-visible { outline: 3px solid var(--ps-blue); outline-offset: 2px; }
</style>
</head>
<body>

<main>
  <div class="wrap">
    <p class="kicker">Paystand Impact Foundation</p>
    <h1>Grant Application 2027</h1>
    <p class="lead">Please complete all required fields. You may answer in English, Spanish or Portuguese.</p>

    <div class="progress" aria-live="polite">
      <div class="pbar"><div class="pfill" id="pfill"></div></div>
      <div class="plabel" id="plabel">0 of 0 required questions answered</div>
    </div>
    <form id="form" novalidate autocomplete="on"></form>
  </div>
</main>

<script src="assets/config.js"></script>
<script src="assets/questions.js"></script>
<script src="assets/form.js"></script>
<script>
  /* If this page is shown inside an iframe (Wix), tell the parent its height so it never scrolls inside. */
  (function () {
    if (window.parent === window) return;
    function send() { window.parent.postMessage({ type: "ga27-height", height: document.documentElement.scrollHeight }, "*"); }
    new ResizeObserver(send).observe(document.body); window.addEventListener("load", send);
  })();
  /* ?demo=1 fills the form with fictitious data (design review only). */
  if (/[?&]demo=1\b/.test(location.search)) {
    var d = document.createElement("script"); d.src = "assets/demo.js"; document.body.appendChild(d);
  }
</script>
</body>
</html>
